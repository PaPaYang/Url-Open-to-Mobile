plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tabletreceiver'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tabletreceiver"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // [중요] 최신 안드로이드 렌더링 충돌 방지 설정
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
