plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tabletreceiver'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.tabletreceiver"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 외부 AndroidX 테마 의존성을 완전히 제거하여 충돌 원인을 차단했습니다.
}
